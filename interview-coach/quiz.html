<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica — Interview Coach</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <header class="site-header">
    <p class="crumb"><a href="index.html">← Volver al inicio</a></p>
    <p class="role-tag" id="role-name">Cargando…</p>
    <p class="progress" id="progress">Pregunta 1 de 5</p>
    <div class="progress-track" aria-hidden="true">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </header>

  <main id="main" class="container">
    <p id="live-region" class="visually-hidden" role="status" aria-live="polite"></p>

    <section class="question-box" aria-labelledby="question-text">
      <h2 id="question-text">Preparando pregunta…</h2>
    </section>

    <form id="answer-form" novalidate>
      <label for="answer-text">Tu respuesta</label>
      <textarea id="answer-text" name="answer" rows="7"
        placeholder="Escribí tu respuesta con ejemplos y detalles…"
        aria-describedby="form-error"></textarea>
      <p id="form-error" class="error" role="alert" hidden></p>
      <div class="actions">
        <button type="submit" class="btn primary">Enviar respuesta</button>
        <button type="button" class="btn ghost" id="exit-btn">Salir de la práctica</button>
      </div>
    </form>

    <section id="feedback" aria-labelledby="feedback-title" hidden></section>

    <div class="actions">
      <button type="button" class="btn primary" id="next-btn" hidden>Siguiente pregunta →</button>
    </div>
  </main>

  <footer class="site-footer">
    <p>Los puntajes son orientativos y no reemplazan una devolución profesional.</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
